<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <!-- Title -->
  <text x="500" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Gambar 10. Distribusi Error Prediksi (Residuals) pada Test Set</text>
  
  <!-- Histogram bins -->
  <line x1="100" y1="450" x2="900" y2="450" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="100" x2="100" y2="450" stroke="#333" stroke-width="2"/>
  
  <!-- Y-axis label -->
  <text x="40" y="275" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333" transform="rotate(-90 40 275)">Frekuensi</text>
  
  <!-- X-axis label -->
  <text x="500" y="490" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Error (kkal/hari)</text>
  
  <!-- Y-axis ticks -->
  <line x1="95" y1="450" x2="100" y2="450" stroke="#333" stroke-width="1"/>
  <text x="85" y="455" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="#666">0</text>
  
  <line x1="95" y1="380" x2="100" y2="380" stroke="#333" stroke-width="1"/>
  <text x="85" y="385" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="#666">5</text>
  
  <line x1="95" y1="310" x2="100" y2="310" stroke="#333" stroke-width="1"/>
  <text x="85" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="#666">10</text>
  
  <line x1="95" y1="240" x2="100" y2="240" stroke="#333" stroke-width="1"/>
  <text x="85" y="245" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="#666">15</text>
  
  <line x1="95" y1="170" x2="100" y2="170" stroke="#333" stroke-width="1"/>
  <text x="85" y="175" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="#666">20</text>
  
  <!-- X-axis ticks -->
  <line x1="150" y1="450" x2="150" y2="455" stroke="#333" stroke-width="1"/>
  <text x="150" y="470" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">-150</text>
  
  <line x1="250" y1="450" x2="250" y2="455" stroke="#333" stroke-width="1"/>
  <text x="250" y="470" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">-100</text>
  
  <line x1="350" y1="450" x2="350" y2="455" stroke="#333" stroke-width="1"/>
  <text x="350" y="470" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">-50</text>
  
  <line x1="500" y1="450" x2="500" y2="455" stroke="#333" stroke-width="1"/>
  <text x="500" y="470" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">0</text>
  
  <line x1="650" y1="450" x2="650" y2="455" stroke="#333" stroke-width="1"/>
  <text x="650" y="470" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">50</text>
  
  <line x1="750" y1="450" x2="750" y2="455" stroke="#333" stroke-width="1"/>
  <text x="750" y="470" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">100</text>
  
  <line x1="850" y1="450" x2="850" y2="455" stroke="#333" stroke-width="1"/>
  <text x="850" y="470" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">150</text>
  
  <!-- Histogram bars (bell-curve distribution) -->
  <rect x="160" y="430" width="40" height="20" fill="#2196F3" opacity="0.7"/>
  <rect x="210" y="410" width="40" height="40" fill="#2196F3" opacity="0.7"/>
  <rect x="260" y="380" width="40" height="70" fill="#2196F3" opacity="0.7"/>
  <rect x="310" y="340" width="40" height="110" fill="#2196F3" opacity="0.7"/>
  <rect x="360" y="290" width="40" height="160" fill="#2196F3" opacity="0.7"/>
  <rect x="410" y="230" width="40" height="220" fill="#2196F3" opacity="0.7"/>
  <rect x="460" y="180" width="40" height="270" fill="#4CAF50" opacity="0.8"/>
  <rect x="510" y="170" width="40" height="280" fill="#4CAF50" opacity="0.9"/>
  <rect x="560" y="180" width="40" height="270" fill="#4CAF50" opacity="0.8"/>
  <rect x="610" y="230" width="40" height="220" fill="#2196F3" opacity="0.7"/>
  <rect x="660" y="290" width="40" height="160" fill="#2196F3" opacity="0.7"/>
  <rect x="710" y="340" width="40" height="110" fill="#2196F3" opacity="0.7"/>
  <rect x="760" y="380" width="40" height="70" fill="#2196F3" opacity="0.7"/>
  <rect x="810" y="410" width="40" height="40" fill="#2196F3" opacity="0.7"/>
  <rect x="860" y="430" width="40" height="20" fill="#2196F3" opacity="0.7"/>
  
  <!-- Normal curve overlay -->
  <path d="M 150 445 Q 200 420, 250 380 Q 300 330, 350 270 Q 400 200, 450 170 Q 475 160, 500 165 Q 525 160, 550 170 Q 600 200, 650 270 Q 700 330, 750 380 Q 800 420, 850 445" 
        stroke="#F44336" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
  
  <!-- Mean line -->
  <line x1="500" y1="100" x2="500" y2="450" stroke="#F44336" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="510" y="120" font-family="Arial, sans-serif" font-size="11" fill="#F44336">Mean ≈ 0</text>
  
  <!-- Standard deviation markers -->
  <line x1="360" y1="100" x2="360" y2="450" stroke="#FF9800" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="365" y="115" font-family="Arial, sans-serif" font-size="9" fill="#FF9800">-1σ</text>
  
  <line x1="640" y1="100" x2="640" y2="450" stroke="#FF9800" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="645" y="115" font-family="Arial, sans-serif" font-size="9" fill="#FF9800">+1σ</text>
  
  <!-- Statistics box -->
  <rect x="650" y="120" width="220" height="120" fill="#FFFDE7" stroke="#F9A825" stroke-width="2" rx="5"/>
  <text x="760" y="145" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#F57F17">Statistik Residual</text>
  <text x="660" y="165" font-family="Arial, sans-serif" font-size="10" fill="#333">Mean Error: -0.8 kkal/hari</text>
  <text x="660" y="182" font-family="Arial, sans-serif" font-size="10" fill="#333">Std Dev (σ): 38.2 kkal/hari</text>
  <text x="660" y="199" font-family="Arial, sans-serif" font-size="10" fill="#333">Skewness: 0.12 (near-normal)</text>
  <text x="660" y="216" font-family="Arial, sans-serif" font-size="10" fill="#333">Kurtosis: 2.89 (mesokurtic)</text>
  <text x="660" y="233" font-family="Arial, sans-serif" font-size="9" fill="#666">95% data dalam ±2σ: 96.3%</text>
  
  <!-- Legend -->
  <rect x="120" y="510" width="760" height="70" fill="#F5F5F5" stroke="#999" stroke-width="1" rx="3"/>
  <text x="130" y="528" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">Interpretasi:</text>
  <text x="130" y="545" font-family="Arial, sans-serif" font-size="9" fill="#666">• Distribusi error mendekati normal (bell curve) dengan mean close to zero, menunjukkan model tidak bias.</text>
  <text x="130" y="560" font-family="Arial, sans-serif" font-size="9" fill="#666">• 68% prediksi berada dalam ±38 kkal/hari (1 standar deviasi), 95% dalam ±76 kkal/hari (2 standar deviasi).</text>
  <text x="130" y="575" font-family="Arial, sans-serif" font-size="9" fill="#666">• Tidak ada skewness ekstrem atau outlier signifikan, mengindikasikan performa stabil across test set.</text>
</svg>
