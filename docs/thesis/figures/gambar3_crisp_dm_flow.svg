<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <!-- Title -->
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Gambar 3. Diagram Alur CRISP-DM</text>
  
  <!-- Central Data circle -->
  <circle cx="450" cy="350" r="80" fill="#E3F2FD" stroke="#1976D2" stroke-width="3"/>
  <text x="450" y="345" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1565C0">DATA</text>
  <text x="450" y="365" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">(NBM Indonesia</text>
  <text x="450" y="380" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">1993-2024)</text>
  
  <!-- Business Understanding (Top) -->
  <ellipse cx="450" cy="100" rx="100" ry="40" fill="#FFF9C4" stroke="#F9A825" stroke-width="2"/>
  <text x="450" y="95" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#F57F17">Business</text>
  <text x="450" y="112" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#F57F17">Understanding</text>
  
  <!-- Data Understanding (Top Right) -->
  <ellipse cx="700" cy="200" rx="100" ry="40" fill="#E1F5FE" stroke="#0288D1" stroke-width="2"/>
  <text x="700" y="195" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#01579B">Data</text>
  <text x="700" y="212" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#01579B">Understanding</text>
  
  <!-- Data Preparation (Right) -->
  <ellipse cx="750" cy="400" rx="100" ry="40" fill="#E0F2F1" stroke="#00796B" stroke-width="2"/>
  <text x="750" y="395" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#004D40">Data</text>
  <text x="750" y="412" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#004D40">Preparation</text>
  
  <!-- Modeling (Bottom Right) -->
  <ellipse cx="600" cy="550" rx="100" ry="40" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
  <text x="600" y="555" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#4A148C">Modeling</text>
  
  <!-- Evaluation (Bottom Left) -->
  <ellipse cx="300" cy="550" rx="100" ry="40" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
  <text x="300" y="555" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#B71C1C">Evaluation</text>
  
  <!-- Deployment (Left) -->
  <ellipse cx="150" cy="350" rx="100" ry="40" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
  <text x="150" y="355" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1B5E20">Deployment</text>
  
  <!-- Arrows: Business Understanding connections -->
  <line x1="500" y1="130" x2="640" y2="180" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 450 140 L 450 270" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Data Understanding to Data -->
  <line x1="650" y1="230" x2="510" y2="305" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Data Understanding to Data Preparation -->
  <line x1="710" y1="240" x2="740" y2="360" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Data to Data Preparation (bidirectional) -->
  <line x1="525" y1="360" x2="650" y2="390" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="410" x2="525" y2="380" stroke="#666" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
  
  <!-- Data Preparation to Modeling -->
  <line x1="710" y1="430" x2="640" y2="520" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Data to Modeling -->
  <line x1="490" y1="415" x2="550" y2="515" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Modeling to Evaluation -->
  <line x1="500" y1="550" x2="400" y2="550" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Modeling to Data Preparation (feedback) -->
  <path d="M 620 510 Q 690 480 750 440" stroke="#7B1FA2" stroke-width="2" fill="none" marker-end="url(#arrowpurple)" stroke-dasharray="5,5"/>
  
  <!-- Evaluation to Business Understanding -->
  <path d="M 280 510 Q 250 300 420 140" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Evaluation to Modeling (feedback) -->
  <path d="M 340 520 Q 450 500 560 520" stroke="#C62828" stroke-width="2" fill="none" marker-end="url(#arrowred)" stroke-dasharray="5,5"/>
  
  <!-- Evaluation to Deployment -->
  <line x1="250" y1="520" x2="190" y2="385" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Deployment to Business Understanding -->
  <path d="M 200 320 Q 280 200 400 130" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Deployment to Data -->
  <line x1="250" y1="350" x2="370" y2="350" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Phase descriptions (small text boxes) -->
  <!-- Business Understanding -->
  <rect x="360" y="60" width="15" height="15" fill="#FFF9C4" stroke="#F9A825" stroke-width="1"/>
  <text x="380" y="71" font-family="Arial, sans-serif" font-size="9" fill="#666">Target: MAPE &lt;10%</text>
  
  <!-- Data Understanding -->
  <rect x="805" y="185" width="15" height="15" fill="#E1F5FE" stroke="#0288D1" stroke-width="1"/>
  <text x="825" y="196" font-family="Arial, sans-serif" font-size="9" fill="#666">41,316 records</text>
  
  <!-- Data Preparation -->
  <rect x="855" y="385" width="15" height="15" fill="#E0F2F1" stroke="#00796B" stroke-width="1"/>
  <text x="875" y="396" font-family="Arial, sans-serif" font-size="9" fill="#666">Scaling, Windowing</text>
  
  <!-- Modeling -->
  <rect x="705" y="540" width="15" height="15" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1"/>
  <text x="725" y="551" font-family="Arial, sans-serif" font-size="9" fill="#666">LSTM Ensemble</text>
  
  <!-- Evaluation -->
  <rect x="205" y="540" width="15" height="15" fill="#FFEBEE" stroke="#C62828" stroke-width="1"/>
  <text x="85" y="551" font-family="Arial, sans-serif" font-size="9" fill="#666">RMSE, MAE, MAPE</text>
  
  <!-- Deployment -->
  <rect x="55" y="340" width="15" height="15" fill="#E8F5E9" stroke="#388E3C" stroke-width="1"/>
  <text x="30" y="351" font-family="Arial, sans-serif" font-size="9" fill="#666">FastAPI + Laravel</text>
  
  <!-- Legend -->
  <rect x="50" y="630" width="800" height="50" fill="#F5F5F5" stroke="#999" stroke-width="1" rx="5"/>
  <text x="60" y="648" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Keterangan:</text>
  
  <line x1="130" y1="645" x2="180" y2="645" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="185" y="648" font-family="Arial, sans-serif" font-size="10" fill="#666">Alur utama</text>
  
  <line x1="270" y1="645" x2="320" y2="645" stroke="#666" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="325" y="648" font-family="Arial, sans-serif" font-size="10" fill="#666">Iterasi/Feedback</text>
  
  <circle cx="450" cy="645" r="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="465" y="648" font-family="Arial, sans-serif" font-size="10" fill="#666">Repository data</text>
  
  <ellipse cx="630" cy="645" rx="30" ry="12" fill="#FFF9C4" stroke="#F9A825" stroke-width="1"/>
  <text x="670" y="648" font-family="Arial, sans-serif" font-size="10" fill="#666">Fase CRISP-DM</text>
  
  <text x="60" y="668" font-family="Arial, sans-serif" font-size="9" fill="#666">Metodologi bersifat iteratif: hasil evaluasi dapat mengarah kembali ke fase modeling, data preparation, atau business understanding</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#C62828"/>
    </marker>
    <marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7B1FA2"/>
    </marker>
  </defs>
</svg>
