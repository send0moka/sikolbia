<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Title -->
  <text x="450" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Gambar 9. Perbandingan Performa Model pada Test Set (2020-2024)</text>
  
  <!-- Y-axis -->
  <line x1="80" y1="80" x2="80" y2="500" stroke="#333" stroke-width="2"/>
  <text x="40" y="290" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333" transform="rotate(-90 40 290)">MAPE (%)</text>
  
  <!-- Y-axis labels -->
  <line x1="75" y1="500" x2="80" y2="500" stroke="#333" stroke-width="1"/>
  <text x="65" y="505" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#666">0</text>
  
  <line x1="75" y1="430" x2="80" y2="430" stroke="#333" stroke-width="1"/>
  <text x="65" y="435" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#666">2</text>
  
  <line x1="75" y1="360" x2="80" y2="360" stroke="#333" stroke-width="1"/>
  <text x="65" y="365" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#666">4</text>
  
  <line x1="75" y1="290" x2="80" y2="290" stroke="#333" stroke-width="1"/>
  <text x="65" y="295" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#666">6</text>
  
  <line x1="75" y1="220" x2="80" y2="220" stroke="#333" stroke-width="1"/>
  <text x="65" y="225" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#666">8</text>
  
  <line x1="75" y1="150" x2="80" y2="150" stroke="#333" stroke-width="1"/>
  <text x="65" y="155" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#666">10</text>
  
  <line x1="75" y1="80" x2="80" y2="80" stroke="#333" stroke-width="1"/>
  <text x="65" y="85" font-family="Arial, sans-serif" font-size="11" text-anchor="end" fill="#666">12</text>
  
  <!-- X-axis -->
  <line x1="80" y1="500" x2="850" y2="500" stroke="#333" stroke-width="2"/>
  <text x="465" y="545" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Model</text>
  
  <!-- Grid lines -->
  <line x1="80" y1="150" x2="850" y2="150" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="80" y1="220" x2="850" y2="220" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="80" y1="290" x2="850" y2="290" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="80" y1="360" x2="850" y2="360" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Target line (MAPE < 10%) -->
  <line x1="80" y1="150" x2="850" y2="150" stroke="#F44336" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="780" y="140" font-family="Arial, sans-serif" font-size="10" fill="#F44336">Target: 10%</text>
  
  <!-- Bar 1: LSTM Single -->
  <rect x="150" y="171" width="120" height="329" fill="#2196F3" stroke="#1565C0" stroke-width="2" rx="3" opacity="0.8"/>
  <text x="210" y="160" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1565C0">9.4%</text>
  <text x="210" y="520" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">LSTM</text>
  <text x="210" y="535" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">Single</text>
  
  <!-- Bar 2: HuberRegressor -->
  <rect x="320" y="91" width="120" height="409" fill="#FF9800" stroke="#E65100" stroke-width="2" rx="3" opacity="0.8"/>
  <text x="380" y="80" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#E65100">11.6%</text>
  <text x="380" y="520" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">Huber</text>
  <text x="380" y="535" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">Regressor</text>
  
  <!-- Bar 3: LSTM Ensemble (Initial) -->
  <rect x="490" y="195" width="120" height="305" fill="#9C27B0" stroke="#6A1B9A" stroke-width="2" rx="3" opacity="0.8"/>
  <text x="550" y="185" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#6A1B9A">8.7%</text>
  <text x="550" y="520" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">LSTM</text>
  <text x="550" y="535" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">Ensemble</text>
  
  <!-- Bar 4: LSTM Ensemble (Final) -->
  <rect x="660" y="201" width="120" height="299" fill="#4CAF50" stroke="#2E7D32" stroke-width="2" rx="3" opacity="0.8"/>
  <text x="720" y="191" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2E7D32">8.5%</text>
  <text x="720" y="520" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">LSTM Ens.</text>
  <text x="720" y="535" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">(Optimized)</text>
  
  <!-- Check marks for passing target -->
  <text x="210" y="175" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#4CAF50">✓</text>
  <text x="550" y="200" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#4CAF50">✓</text>
  <text x="720" y="206" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#4CAF50">✓</text>
  
  <!-- X mark for failing target -->
  <text x="380" y="106" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#F44336">✗</text>
  
  <!-- Legend -->
  <rect x="100" y="560" width="700" height="35" fill="#F5F5F5" stroke="#999" stroke-width="1" rx="3"/>
  <text x="110" y="578" font-family="Arial, sans-serif" font-size="10" fill="#666">Catatan: Model ensemble berhasil melampaui target MAPE &lt; 10% dengan margin 1.5 poin persentase.</text>
  <text x="110" y="590" font-family="Arial, sans-serif" font-size="10" fill="#666">Optimasi lanjutan (synthetic augmentation, ensemble gating) menurunkan MAPE dari 8.7% menjadi 8.5%.</text>
</svg>
