<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650">
  <!-- Title -->
  <text x="500" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Gambar 5. Time Series Cross-Validation Expanding Window</text>
  
  <!-- Timeline header -->
  <text x="150" y="70" font-family="Arial, sans-serif" font-size="12" fill="#666">Tahun →</text>
  <text x="250" y="70" font-family="Arial, sans-serif" font-size="11" fill="#666">1993</text>
  <text x="450" y="70" font-family="Arial, sans-serif" font-size="11" fill="#666">2005</text>
  <text x="650" y="70" font-family="Arial, sans-serif" font-size="11" fill="#666">2010</text>
  <text x="850" y="70" font-family="Arial, sans-serif" font-size="11" fill="#666">2015</text>
  
  <!-- Fold 1 -->
  <text x="50" y="115" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Fold 1</text>
  <rect x="150" y="95" width="300" height="35" fill="#4CAF50" stroke="#2E7D32" stroke-width="2" rx="3" opacity="0.7"/>
  <text x="300" y="117" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Training (1993-2005)</text>
  
  <rect x="450" y="95" width="50" height="35" fill="#FF9800" stroke="#E65100" stroke-width="2" rx="3" opacity="0.8"/>
  <text x="475" y="117" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Val</text>
  
  <!-- Fold 2 -->
  <text x="50" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Fold 2</text>
  <rect x="150" y="145" width="400" height="35" fill="#4CAF50" stroke="#2E7D32" stroke-width="2" rx="3" opacity="0.7"/>
  <text x="350" y="167" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Training (1993-2007)</text>
  
  <rect x="550" y="145" width="50" height="35" fill="#FF9800" stroke="#E65100" stroke-width="2" rx="3" opacity="0.8"/>
  <text x="575" y="167" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Val</text>
  
  <!-- Fold 3 -->
  <text x="50" y="215" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Fold 3</text>
  <rect x="150" y="195" width="500" height="35" fill="#4CAF50" stroke="#2E7D32" stroke-width="2" rx="3" opacity="0.7"/>
  <text x="400" y="217" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Training (1993-2009)</text>
  
  <rect x="650" y="195" width="50" height="35" fill="#FF9800" stroke="#E65100" stroke-width="2" rx="3" opacity="0.8"/>
  <text x="675" y="217" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Val</text>
  
  <!-- Fold 4 -->
  <text x="50" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Fold 4</text>
  <rect x="150" y="245" width="550" height="35" fill="#4CAF50" stroke="#2E7D32" stroke-width="2" rx="3" opacity="0.7"/>
  <text x="425" y="267" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Training (1993-2011)</text>
  
  <rect x="700" y="245" width="50" height="35" fill="#FF9800" stroke="#E65100" stroke-width="2" rx="3" opacity="0.8"/>
  <text x="725" y="267" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Val</text>
  
  <!-- Fold 5 -->
  <text x="50" y="315" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Fold 5</text>
  <rect x="150" y="295" width="600" height="35" fill="#4CAF50" stroke="#2E7D32" stroke-width="2" rx="3" opacity="0.7"/>
  <text x="450" y="317" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Training (1993-2013)</text>
  
  <rect x="750" y="295" width="50" height="35" fill="#FF9800" stroke="#E65100" stroke-width="2" rx="3" opacity="0.8"/>
  <text x="775" y="317" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Val</text>
  
  <!-- Final fold indicator -->
  <text x="50" y="365" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">...</text>
  <rect x="150" y="345" width="700" height="35" fill="#4CAF50" stroke="#2E7D32" stroke-width="2" rx="3" opacity="0.7"/>
  <text x="500" y="367" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Training (1993-2015)</text>
  
  <rect x="850" y="345" width="50" height="35" fill="#FF9800" stroke="#E65100" stroke-width="2" rx="3" opacity="0.8"/>
  <text x="875" y="367" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Val</text>
  
  <!-- Expanding window illustration -->
  <path d="M 150 400 L 150 420 L 450 420 L 500 450 L 550 420 L 850 420 L 850 400" stroke="#2196F3" stroke-width="3" fill="none" marker-end="url(#arrowblue)"/>
  <text x="500" y="475" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1565C0">Window Ekspansif (Expanding Window)</text>
  <text x="500" y="495" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Data training bertambah pada setiap fold berikutnya</text>
  
  <!-- Legend -->
  <rect x="50" y="520" width="900" height="110" fill="#F5F5F5" stroke="#999" stroke-width="1" rx="5"/>
  <text x="60" y="540" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Keterangan:</text>
  
  <rect x="70" y="555" width="60" height="20" fill="#4CAF50" stroke="#2E7D32" stroke-width="1" rx="2" opacity="0.7"/>
  <text x="140" y="569" font-family="Arial, sans-serif" font-size="10" fill="#333">Training Set (ekspansif)</text>
  
  <rect x="280" y="555" width="40" height="20" fill="#FF9800" stroke="#E65100" stroke-width="1" rx="2" opacity="0.8"/>
  <text x="330" y="569" font-family="Arial, sans-serif" font-size="10" fill="#333">Validation Set (1 tahun)</text>
  
  <text x="70" y="595" font-family="Arial, sans-serif" font-size="10" fill="#333"><tspan font-weight="bold">Tujuan:</tspan> Mengevaluasi performa model pada berbagai periode waktu dengan mensimulasikan kondisi real-world</text>
  <text x="70" y="612" font-family="Arial, sans-serif" font-size="10" fill="#333">dimana model terus belajar dari data historis yang bertambah.</text>
  
  <!-- Metrics box -->
  <rect x="50" y="510" width="240" height="20" fill="#FFFDE7" stroke="#F9A825" stroke-width="1" rx="3"/>
  <text x="60" y="523" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#F57F17">Evaluasi: RMSE, MAE, MAPE per fold</text>
  
  <rect x="510" y="510" width="440" height="20" fill="#E3F2FD" stroke="#2196F3" stroke-width="1" rx="3"/>
  <text x="520" y="523" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1565C0">Model terbaik: rata-rata performa tertinggi across all folds</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2196F3"/>
    </marker>
  </defs>
</svg>
