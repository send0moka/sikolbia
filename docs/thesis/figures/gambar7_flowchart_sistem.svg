<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900">
  <!-- Title -->
  <text x="550" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Gambar 7. Flowchart Sistem SIKOLBIA</text>
  
  <!-- Start -->
  <ellipse cx="550" cy="80" rx="60" ry="30" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
  <text x="550" y="87" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">START</text>
  
  <line x1="550" y1="110" x2="550" y2="130" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- User Access System -->
  <rect x="450" y="130" width="200" height="60" fill="#2196F3" stroke="#1565C0" stroke-width="2" rx="5"/>
  <text x="550" y="155" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Pengguna Akses</text>
  <text x="550" y="175" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Sistem SIKOLBIA</text>
  
  <line x1="550" y1="190" x2="550" y2="210" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Authentication Check (Diamond) -->
  <path d="M 550 210 L 650 260 L 550 310 L 450 260 Z" fill="#FFF3E0" stroke="#F57C00" stroke-width="2"/>
  <text x="550" y="255" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#E65100">Login</text>
  <text x="550" y="270" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#E65100">Valid?</text>
  
  <!-- No path -->
  <line x1="450" y1="260" x2="350" y2="260" stroke="#C62828" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="250" font-family="Arial, sans-serif" font-size="10" fill="#C62828">Tidak</text>
  
  <rect x="250" y="230" width="100" height="60" fill="#FFEBEE" stroke="#C62828" stroke-width="2" rx="5"/>
  <text x="300" y="255" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#B71C1C">Tampilkan</text>
  <text x="300" y="272" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#B71C1C">Error Login</text>
  
  <line x1="300" y1="230" x2="300" y2="160" stroke="#C62828" stroke-width="2"/>
  <line x1="300" y1="160" x2="450" y2="160" stroke="#C62828" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Yes path -->
  <line x1="550" y1="310" x2="550" y2="340" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="325" font-family="Arial, sans-serif" font-size="10" fill="#4CAF50">Ya</text>
  
  <!-- Role Check -->
  <path d="M 550 340 L 650 390 L 550 440 L 450 390 Z" fill="#E1F5FE" stroke="#0288D1" stroke-width="2"/>
  <text x="550" y="385" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#01579B">Cek</text>
  <text x="550" y="400" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#01579B">Role User</text>
  
  <!-- Role branches -->
  <line x1="450" y1="390" x2="150" y2="390" stroke="#666" stroke-width="2"/>
  <text x="300" y="380" font-family="Arial, sans-serif" font-size="9" fill="#666">Admin</text>
  <line x1="150" y1="390" x2="150" y2="500" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <line x1="500" y1="440" x2="350" y2="500" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="460" font-family="Arial, sans-serif" font-size="9" fill="#666">Pemerintah</text>
  
  <line x1="550" y1="440" x2="550" y2="500" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="470" font-family="Arial, sans-serif" font-size="9" fill="#666">Akademisi</text>
  
  <line x1="600" y1="440" x2="750" y2="500" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="460" font-family="Arial, sans-serif" font-size="9" fill="#666">Pengunjung</text>
  
  <!-- Admin Actions -->
  <rect x="75" y="500" width="150" height="80" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" rx="5"/>
  <text x="150" y="520" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#2E7D32">Dashboard Admin</text>
  <text x="150" y="537" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">• Kelola User</text>
  <text x="150" y="552" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">• Kelola Data NBM</text>
  <text x="150" y="567" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">• System Monitor</text>
  
  <!-- Pemerintah Actions -->
  <rect x="275" y="500" width="150" height="80" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="5"/>
  <text x="350" y="520" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1565C0">Menu Pemerintah</text>
  <text x="350" y="537" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">• Prediksi NBM</text>
  <text x="350" y="552" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">• View Data Historis</text>
  <text x="350" y="567" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">• Export Report</text>
  
  <!-- Akademisi Actions -->
  <rect x="475" y="500" width="150" height="80" fill="#FFF3E0" stroke="#F57C00" stroke-width="2" rx="5"/>
  <text x="550" y="520" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#E65100">Menu Akademisi</text>
  <text x="550" y="537" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">• View Data NBM</text>
  <text x="550" y="552" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">• Filter &amp; Query</text>
  <text x="550" y="567" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">• Export CSV</text>
  
  <!-- Pengunjung Actions -->
  <rect x="675" y="500" width="150" height="80" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" rx="5"/>
  <text x="750" y="520" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#6A1B9A">Menu Pengunjung</text>
  <text x="750" y="537" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">• Dashboard Publik</text>
  <text x="750" y="552" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">• View Statistics</text>
  <text x="750" y="567" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">(Read-only)</text>
  
  <!-- Prediction Flow (for Pemerintah) -->
  <line x1="350" y1="580" x2="350" y2="620" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow)"/>
  
  <path d="M 350 620 L 450 670 L 350 720 L 250 670 Z" fill="#FFFDE7" stroke="#F9A825" stroke-width="2"/>
  <text x="350" y="665" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#F57F17">Request</text>
  <text x="350" y="680" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#F57F17">Prediksi?</text>
  
  <line x1="250" y1="670" x2="150" y2="670" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="660" font-family="Arial, sans-serif" font-size="9" fill="#666">Tidak</text>
  
  <rect x="50" y="640" width="100" height="60" fill="#FFEBEE" stroke="#C62828" stroke-width="2" rx="5"/>
  <text x="100" y="665" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#B71C1C">View</text>
  <text x="100" y="682" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#B71C1C">Dashboard</text>
  
  <line x1="350" y1="720" x2="350" y2="750" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="365" y="735" font-family="Arial, sans-serif" font-size="9" fill="#4CAF50">Ya</text>
  
  <!-- ML Inference -->
  <rect x="250" y="750" width="200" height="60" fill="#F9A825" stroke="#F57F17" stroke-width="2" rx="5"/>
  <text x="350" y="775" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">FastAPI ML Service</text>
  <text x="350" y="795" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">LSTM Ensemble Inference</text>
  
  <line x1="450" y1="780" x2="550" y2="780" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="550" y="750" width="120" height="60" fill="#00758F" stroke="#004D66" stroke-width="2" rx="5"/>
  <text x="610" y="775" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Load Model</text>
  <text x="610" y="792" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">from Storage</text>
  
  <line x1="350" y1="810" x2="350" y2="840" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Display Results -->
  <rect x="250" y="840" width="200" height="60" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="5"/>
  <text x="350" y="865" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1565C0">Tampilkan Hasil</text>
  <text x="350" y="885" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Chart + Table + CI</text>
  
  <!-- Merge all paths -->
  <line x1="150" y1="580" x2="150" y2="750" stroke="#666" stroke-width="2"/>
  <line x1="550" y1="580" x2="550" y2="750" stroke="#666" stroke-width="2"/>
  <line x1="750" y1="580" x2="750" y2="750" stroke="#666" stroke-width="2"/>
  
  <line x1="100" y1="700" x2="100" y2="850" stroke="#666" stroke-width="2"/>
  <line x1="150" y1="750" x2="150" y2="850" stroke="#666" stroke-width="2"/>
  <line x1="550" y1="750" x2="550" y2="850" stroke="#666" stroke-width="2"/>
  <line x1="750" y1="750" x2="750" y2="850" stroke="#666" stroke-width="2"/>
  
  <line x1="100" y1="850" x2="250" y2="850" stroke="#666" stroke-width="2"/>
  <line x1="450" y1="850" x2="750" y2="850" stroke="#666" stroke-width="2"/>
  
  <!-- End -->
  <ellipse cx="550" cy="880" rx="60" ry="25" fill="#F44336" stroke="#B71C1C" stroke-width="2"/>
  <text x="550" y="887" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">END</text>
  
  <line x1="350" y1="870" x2="490" y2="870" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
</svg>
