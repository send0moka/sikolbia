<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <!-- Title -->
  <text x="500" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Gambar 2. Kerangka Metodologi RnD Terintegrasi dengan CRISP-DM</text>
  
  <!-- RnD Stages (Left Column) -->
  <text x="150" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976D2">Tahapan RnD</text>
  
  <!-- Stage 1: Research & Collection -->
  <rect x="50" y="90" width="200" height="50" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="5"/>
  <text x="150" y="110" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1565C0">1. Research &amp; Collection</text>
  <text x="150" y="125" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Preliminary</text>
  
  <!-- Stage 2: Planning -->
  <rect x="50" y="155" width="200" height="40" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="5"/>
  <text x="150" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1565C0">2. Research Planning</text>
  
  <!-- Stage 3: Early Product -->
  <rect x="50" y="210" width="200" height="40" fill="#FFF3E0" stroke="#F57C00" stroke-width="2" rx="5"/>
  <text x="150" y="235" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#E65100">3. Early Product Dev</text>
  
  <!-- Stage 4: Expert Validation -->
  <rect x="50" y="265" width="200" height="40" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" rx="5"/>
  <text x="150" y="290" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2E7D32">4. Expert Validation</text>
  
  <!-- Stage 5: Revision 1 -->
  <rect x="50" y="320" width="200" height="40" fill="#FCE4EC" stroke="#C2185B" stroke-width="2" rx="5"/>
  <text x="150" y="345" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#AD1457">5. Product Revision</text>
  
  <!-- Stage 6: Early Test (CRISP-DM Integration) -->
  <rect x="50" y="375" width="200" height="50" fill="#FFF9C4" stroke="#F9A825" stroke-width="3" rx="5"/>
  <text x="150" y="395" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#F57F17">6. Early Test</text>
  <text x="150" y="410" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#E65100">(CRISP-DM)</text>
  
  <!-- Stage 7: Revision 2 -->
  <rect x="50" y="440" width="200" height="40" fill="#FCE4EC" stroke="#C2185B" stroke-width="2" rx="5"/>
  <text x="150" y="465" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#AD1457">7. Product Revision</text>
  
  <!-- Stage 8: Field Test -->
  <rect x="50" y="495" width="200" height="40" fill="#E0F2F1" stroke="#00796B" stroke-width="2" rx="5"/>
  <text x="150" y="520" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#00695C">8. Field Test (UAT)</text>
  
  <!-- Stage 9: Final Revision -->
  <rect x="50" y="550" width="200" height="40" fill="#FCE4EC" stroke="#C2185B" stroke-width="2" rx="5"/>
  <text x="150" y="575" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#AD1457">9. Final Revision</text>
  
  <!-- Stage 10: Dissemination -->
  <rect x="50" y="605" width="200" height="40" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" rx="5"/>
  <text x="150" y="630" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#6A1B9A">10. Dissemination</text>
  
  <!-- Arrows between RnD stages -->
  <line x1="150" y1="140" x2="150" y2="155" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="195" x2="150" y2="210" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="250" x2="150" y2="265" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="305" x2="150" y2="320" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="360" x2="150" y2="375" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="425" x2="150" y2="440" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="480" x2="150" y2="495" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="535" x2="150" y2="550" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="590" x2="150" y2="605" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Feedback loops -->
  <path d="M 250 340 Q 300 340 300 400 Q 300 460 250 460" stroke="#C2185B" stroke-width="2" fill="none" marker-end="url(#arrowred)" stroke-dasharray="5,5"/>
  <text x="310" y="400" font-family="Arial, sans-serif" font-size="9" fill="#C2185B">Feedback</text>
  
  <!-- CRISP-DM Phases (Right Column) -->
  <text x="650" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#F9A825">CRISP-DM (dalam Early Test)</text>
  
  <!-- Business Understanding -->
  <ellipse cx="650" cy="140" rx="120" ry="35" fill="#FFF9C4" stroke="#F9A825" stroke-width="2"/>
  <text x="650" y="135" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#F57F17">Business</text>
  <text x="650" y="150" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#F57F17">Understanding</text>
  
  <!-- Data Understanding -->
  <ellipse cx="650" cy="215" rx="120" ry="35" fill="#E1F5FE" stroke="#0288D1" stroke-width="2"/>
  <text x="650" y="210" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#01579B">Data</text>
  <text x="650" y="225" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#01579B">Understanding</text>
  
  <!-- Data Preparation -->
  <ellipse cx="650" cy="290" rx="120" ry="35" fill="#E0F2F1" stroke="#00796B" stroke-width="2"/>
  <text x="650" y="285" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#004D40">Data</text>
  <text x="650" y="300" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#004D40">Preparation</text>
  
  <!-- Modeling -->
  <ellipse cx="650" cy="365" rx="120" ry="35" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
  <text x="650" y="370" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#4A148C">Modeling</text>
  
  <!-- Evaluation -->
  <ellipse cx="650" cy="440" rx="120" ry="35" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
  <text x="650" y="445" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#B71C1C">Evaluation</text>
  
  <!-- Deployment -->
  <ellipse cx="650" cy="515" rx="120" ry="35" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
  <text x="650" y="520" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1B5E20">Deployment</text>
  
  <!-- Arrows between CRISP-DM phases -->
  <line x1="650" y1="175" x2="650" y2="180" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="250" x2="650" y2="255" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="325" x2="650" y2="330" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="400" x2="650" y2="405" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="475" x2="650" y2="480" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Iterative loops in CRISP-DM -->
  <path d="M 770 290 Q 820 290 820 365 Q 820 440 770 440" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
  <text x="830" y="365" font-family="Arial, sans-serif" font-size="9" fill="#666">Iterative</text>
  
  <!-- Connection from Stage 6 to CRISP-DM -->
  <line x1="250" y1="400" x2="530" y2="365" stroke="#F9A825" stroke-width="3" marker-end="url(#arroworange)" stroke-dasharray="10,5"/>
  <text x="390" y="375" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#F9A825">Integrasi</text>
  
  <!-- Integration note -->
  <rect x="350" y="570" width="300" height="80" fill="#FFFDE7" stroke="#F9A825" stroke-width="2" rx="5"/>
  <text x="500" y="590" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#F57F17">Integrasi RnD dengan CRISP-DM</text>
  <text x="500" y="608" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">Early Test (Stage 6) mengimplementasikan</text>
  <text x="500" y="622" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">seluruh fase CRISP-DM untuk pengembangan</text>
  <text x="500" y="636" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">model LSTM Enhanced Ensemble</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#C2185B"/>
    </marker>
    <marker id="arroworange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F9A825"/>
    </marker>
  </defs>
</svg>
