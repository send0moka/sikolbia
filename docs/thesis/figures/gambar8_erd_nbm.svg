<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <!-- Title -->
  <text x="600" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Entity Relationship Diagram (ERD) Modul Konsumsi Pangan NBM</text>
  
  <!-- Users Table -->
  <rect x="50" y="80" width="200" height="160" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" rx="5"/>
  <rect x="50" y="80" width="200" height="35" fill="#1976D2" stroke="#1565C0" stroke-width="2" rx="5"/>
  <text x="150" y="102" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">users</text>
  
  <text x="60" y="135" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">PK id</text>
  <line x1="60" y1="137" x2="110" y2="137" stroke="#333" stroke-width="1"/>
  <text x="60" y="152" font-family="Arial, sans-serif" font-size="9" fill="#666">name</text>
  <text x="60" y="167" font-family="Arial, sans-serif" font-size="9" fill="#666">email (unique)</text>
  <text x="60" y="182" font-family="Arial, sans-serif" font-size="9" fill="#666">password</text>
  <text x="60" y="197" font-family="Arial, sans-serif" font-size="9" fill="#666">remember_token</text>
  <text x="60" y="212" font-family="Arial, sans-serif" font-size="9" fill="#666">created_at</text>
  <text x="60" y="227" font-family="Arial, sans-serif" font-size="9" fill="#666">updated_at</text>
  
  <!-- Roles Table (Spatie Permission) -->
  <rect x="50" y="280" width="200" height="145" fill="#E8F5E9" stroke="#388E3C" stroke-width="2" rx="5"/>
  <rect x="50" y="280" width="200" height="35" fill="#388E3C" stroke="#2E7D32" stroke-width="2" rx="5"/>
  <text x="150" y="302" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">roles</text>
  
  <text x="60" y="335" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">PK id</text>
  <line x1="60" y1="337" x2="110" y2="337" stroke="#333" stroke-width="1"/>
  <text x="60" y="352" font-family="Arial, sans-serif" font-size="9" fill="#666">name (unique)</text>
  <text x="60" y="367" font-family="Arial, sans-serif" font-size="9" fill="#666">guard_name</text>
  <text x="60" y="382" font-family="Arial, sans-serif" font-size="9" fill="#666">created_at</text>
  <text x="60" y="397" font-family="Arial, sans-serif" font-size="9" fill="#666">updated_at</text>
  <text x="60" y="412" font-family="Arial, sans-serif" font-size="8" fill="#999">(Admin, Pemerintah,</text>
  <text x="60" y="423" font-family="Arial, sans-serif" font-size="8" fill="#999">Akademisi, Pengunjung)</text>
  
  <!-- Permissions Table -->
  <rect x="50" y="465" width="200" height="130" fill="#FFF3E0" stroke="#F57C00" stroke-width="2" rx="5"/>
  <rect x="50" y="465" width="200" height="35" fill="#F57C00" stroke="#E65100" stroke-width="2" rx="5"/>
  <text x="150" y="487" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">permissions</text>
  
  <text x="60" y="520" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">PK id</text>
  <line x1="60" y1="522" x2="110" y2="522" stroke="#333" stroke-width="1"/>
  <text x="60" y="537" font-family="Arial, sans-serif" font-size="9" fill="#666">name (unique)</text>
  <text x="60" y="552" font-family="Arial, sans-serif" font-size="9" fill="#666">guard_name</text>
  <text x="60" y="567" font-family="Arial, sans-serif" font-size="9" fill="#666">created_at</text>
  <text x="60" y="582" font-family="Arial, sans-serif" font-size="9" fill="#666">updated_at</text>
  
  <!-- Kelompok Table -->
  <rect x="350" y="80" width="200" height="145" fill="#FCE4EC" stroke="#C2185B" stroke-width="2" rx="5"/>
  <rect x="350" y="80" width="200" height="35" fill="#C2185B" stroke="#AD1457" stroke-width="2" rx="5"/>
  <text x="450" y="102" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">kelompok</text>
  
  <text x="360" y="135" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">PK id</text>
  <line x1="360" y1="137" x2="410" y2="137" stroke="#333" stroke-width="1"/>
  <text x="360" y="152" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">kode (unique)</text>
  <line x1="360" y1="154" x2="440" y2="154" stroke="#333" stroke-width="1"/>
  <text x="360" y="167" font-family="Arial, sans-serif" font-size="9" fill="#666">nama</text>
  <text x="360" y="182" font-family="Arial, sans-serif" font-size="9" fill="#666">created_at</text>
  <text x="360" y="197" font-family="Arial, sans-serif" font-size="9" fill="#666">updated_at</text>
  <text x="360" y="212" font-family="Arial, sans-serif" font-size="8" fill="#999">(10 kelompok: 01-10)</text>
  
  <!-- Komoditi Table -->
  <rect x="350" y="265" width="200" height="160" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" rx="5"/>
  <rect x="350" y="265" width="200" height="35" fill="#7B1FA2" stroke="#6A1B9A" stroke-width="2" rx="5"/>
  <text x="450" y="287" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">komoditi</text>
  
  <text x="360" y="320" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">PK id</text>
  <line x1="360" y1="322" x2="410" y2="322" stroke="#333" stroke-width="1"/>
  <text x="360" y="337" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#666">FK kode_kelompok</text>
  <text x="360" y="352" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">kode_komoditi (unique)</text>
  <line x1="360" y1="354" x2="500" y2="354" stroke="#333" stroke-width="1"/>
  <text x="360" y="367" font-family="Arial, sans-serif" font-size="9" fill="#666">nama</text>
  <text x="360" y="382" font-family="Arial, sans-serif" font-size="9" fill="#666">created_at</text>
  <text x="360" y="397" font-family="Arial, sans-serif" font-size="9" fill="#666">updated_at</text>
  <text x="360" y="412" font-family="Arial, sans-serif" font-size="8" fill="#999">(120 komoditas)</text>
  
  <!-- Transaksi NBM Table -->
  <rect x="650" y="80" width="250" height="290" fill="#FFFDE7" stroke="#F9A825" stroke-width="2" rx="5"/>
  <rect x="650" y="80" width="250" height="35" fill="#F9A825" stroke="#F57F17" stroke-width="2" rx="5"/>
  <text x="775" y="102" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">transaksi_nbms</text>
  
  <text x="660" y="135" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">PK id</text>
  <line x1="660" y1="137" x2="710" y2="137" stroke="#333" stroke-width="1"/>
  <text x="660" y="152" font-family="Arial, sans-serif" font-size="9" fill="#666">kode_kelompok (ref)</text>
  <text x="660" y="167" font-family="Arial, sans-serif" font-size="9" fill="#666">kode_komoditi (ref)</text>
  <text x="660" y="182" font-family="Arial, sans-serif" font-size="9" fill="#666">tahun</text>
  <text x="660" y="197" font-family="Arial, sans-serif" font-size="9" fill="#666">status_angka (enum)</text>
  <text x="660" y="212" font-family="Arial, sans-serif" font-size="9" fill="#666">masukan (decimal)</text>
  <text x="660" y="227" font-family="Arial, sans-serif" font-size="9" fill="#666">keluaran (decimal)</text>
  <text x="660" y="242" font-family="Arial, sans-serif" font-size="9" fill="#666">impor (decimal)</text>
  <text x="660" y="257" font-family="Arial, sans-serif" font-size="9" fill="#666">ekspor (decimal)</text>
  <text x="660" y="272" font-family="Arial, sans-serif" font-size="9" fill="#666">perubahan_stok (decimal)</text>
  <text x="660" y="287" font-family="Arial, sans-serif" font-size="9" fill="#666">pakan, bibit, makanan</text>
  <text x="660" y="302" font-family="Arial, sans-serif" font-size="9" fill="#666">bukan_makanan, tercecer</text>
  <text x="660" y="317" font-family="Arial, sans-serif" font-size="9" fill="#666">penggunaan_lain</text>
  <text x="660" y="332" font-family="Arial, sans-serif" font-size="9" fill="#666">bahan_makanan (decimal)</text>
  <text x="660" y="347" font-family="Arial, sans-serif" font-size="9" fill="#666">created_at</text>
  <text x="660" y="362" font-family="Arial, sans-serif" font-size="9" fill="#666">updated_at</text>
  
  <!-- Prediction Histories Table -->
  <rect x="650" y="420" width="250" height="250" fill="#E1F5FE" stroke="#0288D1" stroke-width="2" rx="5"/>
  <rect x="650" y="420" width="250" height="35" fill="#0288D1" stroke="#01579B" stroke-width="2" rx="5"/>
  <text x="775" y="442" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">prediction_histories</text>
  
  <text x="660" y="475" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">PK id</text>
  <line x1="660" y1="477" x2="710" y2="477" stroke="#333" stroke-width="1"/>
  <text x="660" y="492" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#666">FK user_id</text>
  <text x="660" y="507" font-family="Arial, sans-serif" font-size="9" fill="#666">kode_kelompok</text>
  <text x="660" y="522" font-family="Arial, sans-serif" font-size="9" fill="#666">kode_komoditi</text>
  <text x="660" y="537" font-family="Arial, sans-serif" font-size="9" fill="#666">kelompok_name</text>
  <text x="660" y="552" font-family="Arial, sans-serif" font-size="9" fill="#666">komoditi_name</text>
  <text x="660" y="567" font-family="Arial, sans-serif" font-size="9" fill="#666">bulan_prediksi</text>
  <text x="660" y="582" font-family="Arial, sans-serif" font-size="9" fill="#666">prediction_data (JSON)</text>
  <text x="660" y="597" font-family="Arial, sans-serif" font-size="9" fill="#666">historical_data (JSON)</text>
  <text x="660" y="612" font-family="Arial, sans-serif" font-size="9" fill="#666">confidence_intervals (JSON)</text>
  <text x="660" y="627" font-family="Arial, sans-serif" font-size="9" fill="#666">model_version</text>
  <text x="660" y="642" font-family="Arial, sans-serif" font-size="9" fill="#666">notes, is_bookmarked</text>
  <text x="660" y="657" font-family="Arial, sans-serif" font-size="9" fill="#666">created_at, updated_at</text>
  
  <!-- Pivot Tables (Spatie Permission) -->
  <rect x="980" y="180" width="200" height="100" fill="#F5F5F5" stroke="#757575" stroke-width="1" rx="5"/>
  <text x="1080" y="200" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Pivot Tables</text>
  <text x="990" y="220" font-family="Arial, sans-serif" font-size="9" fill="#666">model_has_roles</text>
  <text x="990" y="235" font-family="Arial, sans-serif" font-size="9" fill="#666">model_has_permissions</text>
  <text x="990" y="250" font-family="Arial, sans-serif" font-size="9" fill="#666">role_has_permissions</text>
  <text x="990" y="270" font-family="Arial, sans-serif" font-size="8" fill="#999">(Spatie Permission RBAC)</text>
  
  <!-- Relationships -->
  <!-- Users to Roles (Many-to-Many via model_has_roles) -->
  <line x1="150" y1="240" x2="150" y2="280" stroke="#388E3C" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="160" y="265" font-family="Arial, sans-serif" font-size="9" fill="#666">N:M</text>
  
  <!-- Roles to Permissions (Many-to-Many via role_has_permissions) -->
  <line x1="150" y1="425" x2="150" y2="465" stroke="#F57C00" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="160" y="448" font-family="Arial, sans-serif" font-size="9" fill="#666">N:M</text>
  
  <!-- Kelompok to Komoditi (One-to-Many) -->
  <line x1="450" y1="225" x2="450" y2="265" stroke="#7B1FA2" stroke-width="2"/>
  <path d="M 445 260 L 450 265 L 455 260" stroke="#7B1FA2" stroke-width="2" fill="none"/>
  <text x="465" y="250" font-family="Arial, sans-serif" font-size="9" fill="#666">1:N</text>
  
  <!-- Kelompok to Transaksi_NBM (reference via kode) -->
  <line x1="550" y1="152" x2="650" y2="152" stroke="#F9A825" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="590" y="145" font-family="Arial, sans-serif" font-size="9" fill="#666">ref</text>
  
  <!-- Komoditi to Transaksi_NBM (reference via kode) -->
  <line x1="550" y1="345" x2="650" y2="225" stroke="#F9A825" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="590" y="280" font-family="Arial, sans-serif" font-size="9" fill="#666">ref</text>
  
  <!-- Users to Prediction_Histories (One-to-Many) -->
  <line x1="250" y1="160" x2="600" y2="160" stroke="#0288D1" stroke-width="2"/>
  <line x1="600" y1="160" x2="600" y2="545" stroke="#0288D1" stroke-width="2"/>
  <line x1="600" y1="545" x2="650" y2="545" stroke="#0288D1" stroke-width="2"/>
  <path d="M 645 540 L 650 545 L 645 550" stroke="#0288D1" stroke-width="2" fill="none"/>
  <text x="610" y="350" font-family="Arial, sans-serif" font-size="9" fill="#666">1:N</text>
  
  <!-- Legend -->
  <rect x="50" y="640" width="320" height="140" fill="#F5F5F5" stroke="#999" stroke-width="1" rx="5"/>
  <text x="60" y="660" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Keterangan:</text>
  
  <text x="60" y="678" font-family="Arial, sans-serif" font-size="9" fill="#666">PK = Primary Key (identifier unik)</text>
  <text x="60" y="693" font-family="Arial, sans-serif" font-size="9" fill="#666">FK = Foreign Key (dengan constraint)</text>
  
  <line x1="60" y1="708" x2="100" y2="708" stroke="#666" stroke-width="2"/>
  <path d="M 95 703 L 100 708 L 95 713" stroke="#666" stroke-width="2" fill="none"/>
  <text x="105" y="711" font-family="Arial, sans-serif" font-size="9" fill="#666">One-to-Many (1:N)</text>
  
  <line x1="60" y1="728" x2="100" y2="728" stroke="#666" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="105" y="731" font-family="Arial, sans-serif" font-size="9" fill="#666">Many-to-Many (N:M) via pivot</text>
  
  <line x1="60" y1="748" x2="100" y2="748" stroke="#666" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="105" y="751" font-family="Arial, sans-serif" font-size="9" fill="#666">Reference (tanpa FK constraint)</text>
  
  <text x="60" y="770" font-family="Arial, sans-serif" font-size="9" fill="#666">• transaksi_nbms: 41.316 records (1993-2024)</text>
</svg>
