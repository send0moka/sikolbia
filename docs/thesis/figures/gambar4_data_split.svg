<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400">
  <!-- Title -->
  <text x="500" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Gambar 4. Strategi Pembagian Data NBM Indonesia (1993-2024)</text>
  
  <!-- Timeline axis -->
  <line x1="50" y1="150" x2="950" y2="150" stroke="#333" stroke-width="2"/>
  
  <!-- Year markers -->
  <line x1="50" y1="145" x2="50" y2="155" stroke="#333" stroke-width="2"/>
  <text x="50" y="175" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">1993</text>
  
  <line x1="320" y1="145" x2="320" y2="155" stroke="#333" stroke-width="2"/>
  <text x="320" y="175" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">2015</text>
  
  <line x1="590" y1="145" x2="590" y2="155" stroke="#333" stroke-width="2"/>
  <text x="590" y="175" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">2019</text>
  
  <line x1="950" y1="145" x2="950" y2="155" stroke="#333" stroke-width="2"/>
  <text x="950" y="175" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">2024</text>
  
  <!-- Training set (70%) -->
  <rect x="50" y="70" width="270" height="60" fill="#4CAF50" stroke="#2E7D32" stroke-width="2" rx="5" opacity="0.8"/>
  <text x="185" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">DATA PELATIHAN (70%)</text>
  <text x="185" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">1993 - 2015 (23 tahun)</text>
  
  <!-- Validation set (15%) -->
  <rect x="320" y="70" width="270" height="60" fill="#2196F3" stroke="#1565C0" stroke-width="2" rx="5" opacity="0.8"/>
  <text x="455" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">DATA VALIDASI (15%)</text>
  <text x="455" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">2016 - 2019 (4 tahun)</text>
  
  <!-- Test set (15%) -->
  <rect x="590" y="70" width="360" height="60" fill="#FF9800" stroke="#E65100" stroke-width="2" rx="5" opacity="0.8"/>
  <text x="770" y="95" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">DATA PENGUJIAN (15%)</text>
  <text x="770" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">2020 - 2024 (4 tahun)</text>
  
  <!-- Details boxes -->
  <!-- Training details -->
  <rect x="50" y="200" width="270" height="120" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2" rx="5"/>
  <text x="185" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2E7D32">Training Set</text>
  <text x="60" y="240" font-family="Arial, sans-serif" font-size="10" fill="#333">• 276 data points bulanan</text>
  <text x="60" y="258" font-family="Arial, sans-serif" font-size="10" fill="#333">• Mencakup krisis moneter 1998</text>
  <text x="60" y="276" font-family="Arial, sans-serif" font-size="10" fill="#333">• Periode recovery ekonomi</text>
  <text x="60" y="294" font-family="Arial, sans-serif" font-size="10" fill="#333">• Variasi pola konsumsi pangan</text>
  <text x="60" y="312" font-family="Arial, sans-serif" font-size="10" fill="#333">• Digunakan untuk pelatihan model</text>
  
  <!-- Validation details -->
  <rect x="340" y="200" width="230" height="120" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" rx="5"/>
  <text x="455" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1565C0">Validation Set</text>
  <text x="350" y="240" font-family="Arial, sans-serif" font-size="10" fill="#333">• 48 data points bulanan</text>
  <text x="350" y="258" font-family="Arial, sans-serif" font-size="10" fill="#333">• Periode ekonomi stabil</text>
  <text x="350" y="276" font-family="Arial, sans-serif" font-size="10" fill="#333">• Pre-pandemi COVID-19</text>
  <text x="350" y="294" font-family="Arial, sans-serif" font-size="10" fill="#333">• Hyperparameter tuning</text>
  <text x="350" y="312" font-family="Arial, sans-serif" font-size="10" fill="#333">• Model selection</text>
  
  <!-- Test details -->
  <rect x="590" y="200" width="360" height="120" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" rx="5"/>
  <text x="770" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#E65100">Test Set</text>
  <text x="600" y="240" font-family="Arial, sans-serif" font-size="10" fill="#333">• 48 data points bulanan</text>
  <text x="600" y="258" font-family="Arial, sans-serif" font-size="10" fill="#333">• Mencakup pandemi COVID-19 (2020-2021)</text>
  <text x="600" y="276" font-family="Arial, sans-serif" font-size="10" fill="#333">• Shock ekonomi &amp; gangguan supply chain</text>
  <text x="600" y="294" font-family="Arial, sans-serif" font-size="10" fill="#333">• Evaluasi final performa model</text>
  <text x="600" y="312" font-family="Arial, sans-serif" font-size="10" fill="#333">• Test robustness terhadap kondisi ekstrem</text>
  
  <!-- Summary box -->
  <rect x="50" y="340" width="900" height="45" fill="#FFFDE7" stroke="#F9A825" stroke-width="2" rx="5"/>
  <text x="500" y="360" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#F57F17">Total Dataset: 372 data points (31 tahun × 12 bulan)</text>
  <text x="500" y="378" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Pembagian kronologis (time-based split) untuk menjaga integritas temporal dan mencegah data leakage</text>
</svg>
