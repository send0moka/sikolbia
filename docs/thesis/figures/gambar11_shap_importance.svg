<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <!-- Title -->
  <text x="500" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Gambar 11. Importance Score Fitur Berdasarkan SHAP Analysis</text>
  
  <!-- Y-axis -->
  <line x1="280" y1="80" x2="280" y2="500" stroke="#333" stroke-width="2"/>
  <text x="240" y="290" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333" transform="rotate(-90 240 290)">Fitur</text>
  
  <!-- X-axis -->
  <line x1="280" y1="500" x2="900" y2="500" stroke="#333" stroke-width="2"/>
  <text x="590" y="535" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Mean |SHAP Value| (Importance Score)</text>
  
  <!-- X-axis ticks -->
  <line x1="280" y1="500" x2="280" y2="505" stroke="#333" stroke-width="1"/>
  <text x="280" y="520" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">0</text>
  
  <line x1="400" y1="500" x2="400" y2="505" stroke="#333" stroke-width="1"/>
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">0.1</text>
  
  <line x1="520" y1="500" x2="520" y2="505" stroke="#333" stroke-width="1"/>
  <text x="520" y="520" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">0.2</text>
  
  <line x1="640" y1="500" x2="640" y2="505" stroke="#333" stroke-width="1"/>
  <text x="640" y="520" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">0.3</text>
  
  <line x1="760" y1="500" x2="760" y2="505" stroke="#333" stroke-width="1"/>
  <text x="760" y="520" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">0.4</text>
  
  <line x1="880" y1="500" x2="880" y2="505" stroke="#333" stroke-width="1"/>
  <text x="880" y="520" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">0.5</text>
  
  <!-- Grid lines -->
  <line x1="400" y1="80" x2="400" y2="500" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="520" y1="80" x2="520" y2="500" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="640" y1="80" x2="640" y2="500" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="760" y1="80" x2="760" y2="500" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="880" y1="80" x2="880" y2="500" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Bar 1: lag_1 (highest) -->
  <rect x="280" y="100" width="570" height="40" fill="#4CAF50" stroke="#2E7D32" stroke-width="2" rx="3" opacity="0.8"/>
  <text x="180" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#333">Lag-1 (t-1)</text>
  <text x="860" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2E7D32">0.47</text>
  
  <!-- Bar 2: lag_2 -->
  <rect x="280" y="155" width="480" height="40" fill="#2196F3" stroke="#1565C0" stroke-width="2" rx="3" opacity="0.8"/>
  <text x="180" y="180" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#333">Lag-2 (t-2)</text>
  <text x="770" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1565C0">0.39</text>
  
  <!-- Bar 3: rolling_mean_3 -->
  <rect x="280" y="210" width="420" height="40" fill="#9C27B0" stroke="#6A1B9A" stroke-width="2" rx="3" opacity="0.8"/>
  <text x="180" y="235" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#333">Rolling MA-3</text>
  <text x="710" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#6A1B9A">0.34</text>
  
  <!-- Bar 4: lag_3 -->
  <rect x="280" y="265" width="330" height="40" fill="#FF9800" stroke="#E65100" stroke-width="2" rx="3" opacity="0.8"/>
  <text x="180" y="290" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#333">Lag-3 (t-3)</text>
  <text x="620" y="290" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#E65100">0.27</text>
  
  <!-- Bar 5: rolling_mean_6 -->
  <rect x="280" y="320" width="270" height="40" fill="#00BCD4" stroke="#006064" stroke-width="2" rx="3" opacity="0.8"/>
  <text x="180" y="345" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#333">Rolling MA-6</text>
  <text x="560" y="345" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#006064">0.22</text>
  
  <!-- Bar 6: month_sin -->
  <rect x="280" y="375" width="180" height="40" fill="#FFC107" stroke="#F57F17" stroke-width="2" rx="3" opacity="0.8"/>
  <text x="180" y="400" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#333">Month (sin)</text>
  <text x="470" y="400" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#F57F17">0.14</text>
  
  <!-- Bar 7: month_cos -->
  <rect x="280" y="430" width="150" height="40" fill="#795548" stroke="#4E342E" stroke-width="2" rx="3" opacity="0.8"/>
  <text x="180" y="455" font-family="Arial, sans-serif" font-size="12" text-anchor="end" fill="#333">Month (cos)</text>
  <text x="440" y="455" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4E342E">0.12</text>
  
  <!-- Ranking labels -->
  <text x="895" y="125" font-family="Arial, sans-serif" font-size="10" fill="#666">#1</text>
  <text x="895" y="180" font-family="Arial, sans-serif" font-size="10" fill="#666">#2</text>
  <text x="895" y="235" font-family="Arial, sans-serif" font-size="10" fill="#666">#3</text>
  <text x="895" y="290" font-family="Arial, sans-serif" font-size="10" fill="#666">#4</text>
  <text x="895" y="345" font-family="Arial, sans-serif" font-size="10" fill="#666">#5</text>
  <text x="895" y="400" font-family="Arial, sans-serif" font-size="10" fill="#666">#6</text>
  <text x="895" y="455" font-family="Arial, sans-serif" font-size="10" fill="#666">#7</text>
  
  <!-- Insight box -->
  <rect x="60" y="545" width="880" height="45" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2" rx="5"/>
  <text x="70" y="563" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2E7D32">Key Insights:</text>
  <text x="70" y="578" font-family="Arial, sans-serif" font-size="9" fill="#333">• Top 3 fitur (Lag-1, Lag-2, Rolling MA-3) berkontribusi 71% terhadap total importance, mengonfirmasi bahwa pola temporal jangka pendek dominan.</text>
  <text x="70" y="590" font-family="Arial, sans-serif" font-size="9" fill="#333">• Cyclical encoding (month sin/cos) memiliki kontribusi moderat (13%), menangkap seasonality konsumsi pangan Indonesia.</text>
</svg>
