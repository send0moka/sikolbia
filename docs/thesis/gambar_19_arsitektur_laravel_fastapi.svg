<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <defs>
    <style>
      .title { font: bold 18px sans-serif; fill: #2c3e50; }
      .label { font: 14px sans-serif; fill: #2c3e50; text-anchor: middle; }
      .sublabel { font: 12px sans-serif; fill: #555; text-anchor: middle; }
      .box { fill: #3498db; stroke: #2980b9; stroke-width: 2; }
      .box-laravel { fill: #ff2d20; stroke: #cc2417; stroke-width: 2; }
      .box-fastapi { fill: #009688; stroke: #00796b; stroke-width: 2; }
      .box-db { fill: #f39c12; stroke: #d68910; stroke-width: 2; }
      .box-model { fill: #9b59b6; stroke: #8e44ad; stroke-width: 2; }
      .arrow { fill: none; stroke: #34495e; stroke-width: 2; marker-end: url(#arrowhead); }
      .arrow-return { fill: none; stroke: #e74c3c; stroke-width: 2; marker-end: url(#arrowhead-return); stroke-dasharray: 5,5; }
      .text-white { fill: white; font: bold 14px sans-serif; text-anchor: middle; }
      .step { font: 12px sans-serif; fill: #e74c3c; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495e" />
    </marker>
    <marker id="arrowhead-return" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e74c3c" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="500" y="30" class="title" text-anchor="middle">Gambar 19. Arsitektur Komunikasi Laravel-FastAPI ML Service</text>
  
  <!-- User/Browser -->
  <rect x="50" y="80" width="120" height="80" rx="10" class="box"/>
  <text x="110" y="110" class="text-white">User</text>
  <text x="110" y="130" class="text-white">(Browser)</text>
  <text x="110" y="145" class="sublabel" fill="white" font-size="11">Port 8000</text>
  
  <!-- Laravel Application -->
  <rect x="250" y="80" width="180" height="120" rx="10" class="box-laravel"/>
  <text x="340" y="115" class="text-white">Laravel Application</text>
  <line x1="260" y1="130" x2="420" y2="130" stroke="white" stroke-width="1"/>
  <text x="340" y="150" class="text-white" font-size="12">• Business Logic</text>
  <text x="340" y="168" class="text-white" font-size="12">• Authentication</text>
  <text x="340" y="186" class="text-white" font-size="12">• UI/Livewire</text>
  
  <!-- FastAPI Service -->
  <rect x="530" y="80" width="180" height="120" rx="10" class="box-fastapi"/>
  <text x="620" y="115" class="text-white">FastAPI ML Service</text>
  <line x1="540" y1="130" x2="700" y2="130" stroke="white" stroke-width="1"/>
  <text x="620" y="150" class="text-white" font-size="12">• Model Inference</text>
  <text x="620" y="168" class="text-white" font-size="12">• Feature Engineering</text>
  <text x="620" y="186" class="text-white" font-size="12">Port 8082</text>
  
  <!-- MySQL Database -->
  <rect x="250" y="280" width="180" height="80" rx="10" class="box-db"/>
  <text x="340" y="310" class="text-white">MySQL Database</text>
  <text x="340" y="330" class="text-white" font-size="12">Port 3306</text>
  <text x="340" y="345" class="sublabel" fill="white" font-size="11">NBM Historical Data</text>
  
  <!-- Model Artifacts -->
  <rect x="780" y="80" width="160" height="120" rx="10" class="box-model"/>
  <text x="860" y="115" class="text-white">Model Artifacts</text>
  <line x1="790" y1="130" x2="930" y2="130" stroke="white" stroke-width="1"/>
  <text x="860" y="150" class="text-white" font-size="11">nbm_production_</text>
  <text x="860" y="166" class="text-white" font-size="11">model.pkl</text>
  <text x="860" y="186" class="sublabel" fill="white" font-size="10">HuberRegressor</text>
  
  <!-- Arrows and Flow -->
  <!-- 1. User to Laravel -->
  <path d="M 170 120 L 240 120" class="arrow"/>
  <text x="205" y="110" class="step">1</text>
  <text x="205" y="145" class="sublabel">HTTP Request</text>
  
  <!-- 2. Laravel to Database -->
  <path d="M 340 200 L 340 270" class="arrow"/>
  <text x="320" y="235" class="step">2</text>
  <text x="365" y="235" class="sublabel">Query Data</text>
  
  <!-- 3. Laravel to FastAPI -->
  <path d="M 430 140 L 520 140" class="arrow"/>
  <text x="475" y="130" class="step">3</text>
  <text x="475" y="160" class="sublabel">POST /predict</text>
  <text x="475" y="175" class="sublabel" font-size="10">(JSON Payload)</text>
  
  <!-- 4. FastAPI to Model -->
  <path d="M 710 140 L 770 140" class="arrow"/>
  <text x="740" y="130" class="step">4</text>
  <text x="740" y="160" class="sublabel">Load &amp; Predict</text>
  
  <!-- 5. FastAPI Return -->
  <path d="M 620 200 L 620 400 L 340 400 L 340 360" class="arrow-return"/>
  <text x="480" y="420" class="step">5</text>
  <text x="520" y="420" class="sublabel">JSON Response</text>
  <text x="520" y="435" class="sublabel" font-size="10">(Predictions + CI)</text>
  
  <!-- 6. Laravel to User -->
  <path d="M 250 120 L 180 120" class="arrow-return"/>
  <text x="215" y="110" class="step">6</text>
  <text x="215" y="145" class="sublabel">Display Results</text>
  
  <!-- Legend -->
  <g transform="translate(50, 480)">
    <text x="0" y="0" class="label" text-anchor="start" font-weight="bold">Legend:</text>
    <line x1="0" y1="20" x2="40" y2="20" class="arrow"/>
    <text x="50" y="25" class="sublabel" text-anchor="start">Request Flow</text>
    
    <line x1="0" y1="45" x2="40" y2="45" class="arrow-return"/>
    <text x="50" y="50" class="sublabel" text-anchor="start">Response Flow</text>
    
    <rect x="150" y="10" width="30" height="20" class="box-laravel"/>
    <text x="190" y="25" class="sublabel" text-anchor="start">Laravel (PHP 8.3)</text>
    
    <rect x="150" y="35" width="30" height="20" class="box-fastapi"/>
    <text x="190" y="50" class="sublabel" text-anchor="start">FastAPI (Python 3.10)</text>
    
    <rect x="350" y="10" width="30" height="20" class="box-db"/>
    <text x="390" y="25" class="sublabel" text-anchor="start">Database (MySQL 8.0)</text>
    
    <rect x="350" y="35" width="30" height="20" class="box-model"/>
    <text x="390" y="50" class="sublabel" text-anchor="start">ML Model Artifacts</text>
  </g>
  
  <!-- Notes -->
  <g transform="translate(600, 450)">
    <text x="0" y="0" class="sublabel" text-anchor="start" font-weight="bold">Communication Protocol:</text>
    <text x="0" y="20" class="sublabel" text-anchor="start" font-size="11">• HTTP REST API</text>
    <text x="0" y="38" class="sublabel" text-anchor="start" font-size="11">• JSON Data Format</text>
    <text x="0" y="56" class="sublabel" text-anchor="start" font-size="11">• Guzzle HTTP Client</text>
    <text x="0" y="74" class="sublabel" text-anchor="start" font-size="11">• 30s Timeout</text>
  </g>
</svg>
