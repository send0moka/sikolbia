  <text x="450" y="160" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">• CRISP-DM Integration</text>
  <text x="450" y="180" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">• Architecture Design</text>
  
