  <text x="830" y="780" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50" text-anchor="middle">10. Dissemination</text>
  <text x="690" y="800" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">• Documentation • Knowledge Transfer</text>
  
  <!-- Feedback Loops dengan garis putus-putus -->
  <line x1="430" y1="330" x2="360" y2="330" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="365,325 355,330 365,335" fill="#2c3e50"/>
  
  <line x1="470" y1="570" x2="400" y2="570" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="405,565 395,570 405,575" fill="#2c3e50"/>
  
  <line x1="840" y1="570" x2="770" y2="570" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,5"/>
  <polygon points="775,565 765,570 775,575" fill="#2c3e50"/>
  
  <!-- CRISP-DM Highlight Legend -->
  <rect x="50" y="20" width="400" height="30" fill="#1565c0" rx="5"/>
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">CRISP-DM Integration Highlighted in Blue</text>
