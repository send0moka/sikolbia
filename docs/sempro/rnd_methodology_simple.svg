  <text x="470" y="635" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">• Performance Enhancement</text>
  <text x="470" y="655" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">• UI/UX Refinement</text>
  
