  <text x="100" y="130" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">• Literature Review</text>
  <text x="100" y="150" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">• Stakeholder Analysis</text>
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">• NBM Data Collection</text>
  
  <!-- Arrow 1 to 2 -->
