  <text x="840" y="615" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">• Accuracy Assessment</text>
  <text x="840" y="635" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">• Stakeholder Feedback</text>
  <text x="840" y="655" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">• Government Validation</text>
  
  <!-- Vertical arrow to Phase 4 -->
