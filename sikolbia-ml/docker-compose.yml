version: '3.8'

services:
  ml-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sikolbia-ml:latest
    container_name: sikolbia-ml-api
    restart: unless-stopped
    ports:
      - "8082:8000"
    volumes:
      # ML models (read-only) - REQUIRED for ML predictions
      # Container works without models (fallback to statistical predictions)
      - ./ml_models/models:/app/ml_models/models:ro
      
      # Optional: Mount full ml_models directory for training/data access
      # - ./ml_models:/app/ml_models
      
      # Logs directory (read-write)
      - ./logs:/app/logs
    environment:
      - APP_ENV=production
      - MODEL_PATH=/app/ml_models/models/nbm_production
      - KERAS_MODEL_PATH=/app/models/nbm_production_model.keras
    networks:
      - sikolbia-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  sikolbia-network:
    external: true
    name: sikolbia-network
