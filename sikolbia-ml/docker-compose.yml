# File: sikolbia-ml/docker-compose.yml
# Hanya define ML API service, gunakan MySQL & Redis dari sikolbia-app

services:
  sikolbia-ml-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sikolbia-ml-api
    working_dir: /app
    volumes:
      - ./app:/app/app
      - ./ml_models:/app/ml_models:ro
      - ./data:/app/data:ro
      - ./logs:/app/logs
    ports:
      - "8082:8000"
    environment:
      - DB_HOST=sikolbia-mysql  # Gunakan container name dari sikolbia-app
      - DB_PORT=3306
      - DB_USERNAME=sikolbia_user
      - DB_PASSWORD=sikolbia_pass
      - DB_DATABASE=sikolbia_db
      - PYTHONUNBUFFERED=1
    networks:
      - sikolbia-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

networks:
  sikolbia-network:
    external: true
    name: sikolbia-network