name: Orchestrator Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'app/Services/ChatOrchestrationService.php'
      - 'app/Services/RAGSummarizer.php'
      - 'app/Services/KnowledgeBaseService.php'
      - 'app/Services/SmallTalkService.php'
      - 'tests/Unit/OrchestratorIntentTest.php'
      - 'tests/Feature/ChatbotSmalltalkDefinitionTest.php'
      - '.github/workflows/orchestrator-tests.yml'
      - 'composer.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/Services/ChatOrchestrationService.php'
      - 'app/Services/RAGSummarizer.php'
      - 'app/Services/KnowledgeBaseService.php'
      - 'app/Services/SmallTalkService.php'
      - 'tests/Unit/OrchestratorIntentTest.php'
      - 'tests/Feature/ChatbotSmalltalkDefinitionTest.php'
      - '.github/workflows/orchestrator-tests.yml'
      - 'composer.json'

jobs:
  pest-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, intl, pdo_sqlite, sqlite3

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare testing env
        run: |
          cp .env.example .env.testing || true
          php -r "file_exists('database/testing.sqlite') || touch('database/testing.sqlite');"
          php artisan key:generate --env=testing
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - name: Run orchestrator tests only
        run: ./vendor/bin/pest tests/Unit/OrchestratorIntentTest.php tests/Feature/ChatbotSmalltalkDefinitionTest.php --colors=always
        env:
          APP_ENV: testing
          APP_DEBUG: true
          LOG_CHANNEL: stack
          LOG_LEVEL: info
          ORCHESTRATOR_ENABLED: true
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          DB_CONNECTION: sqlite
          DB_DATABASE: database/testing.sqlite
