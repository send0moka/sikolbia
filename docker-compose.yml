services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: basis-data-konsumsi-pangan-app
    container_name: basis-data-konsumsi-pangan-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:delegated
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    networks:
      - laravel
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=konsumsi_pangan
      - DB_USERNAME=root
      - DB_PASSWORD=rootsecret
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m

  nginx:
    image: nginx:alpine
    container_name: basis-data-konsumsi-pangan-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  mysql:
    image: mysql:8.0
    container_name: basis-data-konsumsi-pangan-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: konsumsi_pangan
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_INNODB_BUFFER_POOL_SIZE: 256M
      MYSQL_INNODB_LOG_FILE_SIZE: 64M
      MYSQL_INNODB_FLUSH_LOG_AT_TRX_COMMIT: 2
      MYSQL_QUERY_CACHE_SIZE: 64M
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - laravel
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=256M --innodb-log-file-size=64M --innodb-flush-log-at-trx-commit=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: basis-data-konsumsi-pangan-phpmyadmin
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - laravel

  redis:
    image: redis:7-alpine
    container_name: basis-data-konsumsi-pangan-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - laravel
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  fastapi-ml:
    build: ./fastapi
    container_name: basis-data-konsumsi-pangan-ml-api
    restart: unless-stopped
    ports:
      - "8082:8000"
    depends_on:
      - redis
      - mysql
    volumes:
      - ./ml_models:/app/ml_models
      - ./fastapi/logs:/app/logs
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=mysql://root:rootsecret@mysql:3306/konsumsi_pangan
      - APP_ENV=production
    networks:
      - laravel
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  db_data:
  vendor_data:
  node_modules_data:
  redis_data:
  ml_models_data:

networks:
  laravel:
    driver: bridge